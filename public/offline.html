<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11112f" />
  <title>Offline - BES Expo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #142b45; background: #f7f5f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    header { height: 76px; display: flex; align-items: center; padding: 12px max(24px, calc((100vw - 1280px) / 2)); background: #11112f; }
    header img { width: 205px; height: auto; display: block; }
    main { min-height: calc(100dvh - 76px); display: grid; place-items: center; padding: 32px 20px; }
    .card { width: 100%; max-width: 470px; background: white; border: 1px solid #e2e7ec; border-radius: 16px; padding: 44px 36px; text-align: center; box-shadow: 0 8px 32px #142b4506; }
    .icon { width: 60px; height: 60px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 12px; background: #f7f5f0; color: #96743e; }
    .eyebrow { color: #85652f; font-size: 10px; letter-spacing: .15em; text-transform: uppercase; font-weight: 600; }
    h1 { font-size: 34px; font-weight: 500; letter-spacing: -.04em; margin: 12px 0 16px; }
    p { color: #637183; font-size: 14px; line-height: 1.8; margin: 0 0 24px; }
    .btn { display: inline-flex; justify-content: center; align-items: center; gap: 16px; min-height: 48px; background: #142b45; color: white; text-decoration: none; padding: 14px 24px; border-radius: 8px; font-size: 13px; font-weight: 600; }
    .btn:hover { background: #244665; }
    :focus-visible { outline: 3px solid #b08a48; outline-offset: 4px; }
    .hint { font-size: 11px; line-height: 1.7; margin: 24px 0 0; }
    @media (max-width: 480px) { .card { padding: 32px 24px; } h1 { font-size: 29px; } }
  </style>
</head>
<body>
  <header><a href="/" aria-label="Broadcast Engineering Society India home"><img src="/Images/Logo/logo_new.png" width="320" height="89" alt="Broadcast Engineering Society (India)" /></a></header>
  <main id="main-content">
    <div class="card">
      <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m3 3 18 18M2 8a16 16 0 0 1 3-2M9 4a16 16 0 0 1 13 4M5 12a11 11 0 0 1 3-2M12 9a11 11 0 0 1 7 3M8 16a6 6 0 0 1 8 0M12 20h.01" /></svg></div>
      <span class="eyebrow">We’ll reconnect shortly</span>
      <h1>You’re offline.</h1>
      <p>Check your internet connection and try again to continue exploring BES India.</p>
      <a href="/" class="btn">Try again <span aria-hidden="true">→</span></a>
      <p class="hint">This page will reload when your connection returns.</p>
    </div>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
